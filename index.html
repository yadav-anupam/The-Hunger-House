<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>The Hunger House — Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #151210;
    --bg-2: #1b1714;
    --card: #1e1a17;
    --card-border: #2c2620;
    --yellow: #F6C51A;
    --yellow-deep: #E0AD0E;
    --white: #F6F2E8;
    --muted: #A79E90;
    --veg: #3FA34D;
    --nonveg: #D9463B;
    --radius: 14px;
    --maxw: 520px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; overflow-x:hidden;}
  body{
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.025), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--white);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--yellow); color:#1a1a1a; }
  a{ color:inherit; }

  .app{ max-width: var(--maxw); margin: 0 auto; position:relative; padding-bottom: 64px; }

  /* ---------- HEADER ---------- */
  header.top{
    position: sticky; top:0; z-index: 50;
    background: linear-gradient(180deg, rgba(21,18,16,0.98) 80%, rgba(21,18,16,0.9));
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--card-border);
    padding: 14px 18px 12px;
  }
  .top-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .brand-name{
    font-family:'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 1.5px;
    color: var(--yellow);
    line-height: 0.95;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  }
  .brand-tag{
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 3px;
    font-weight:600;
  }
  .brand-loc{
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .love-badge{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:10px;
    font-size: 10.5px;
    color: var(--muted);
    border: 1px dashed var(--card-border);
    padding: 4px 10px 4px 8px;
    border-radius: 20px;
    width: fit-content;
  }
  .love-badge svg{ width:11px; height:11px; }

  /* ---------- FILTER TABS ---------- */
  .filters{
    display:flex; gap:8px;
    padding: 12px 18px 4px;
  }
  .filter-btn{
    flex:1;
    text-align:center;
    padding: 9px 6px;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    background: var(--card);
    color: var(--muted);
    border: 1.5px solid var(--card-border);
    border-radius: 9px;
    cursor:pointer;
    transition: transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
    user-select:none;
  }
  .filter-btn .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .filter-btn.all .dot{ background: var(--yellow); }
  .filter-btn.veg .dot{ background: var(--veg); }
  .filter-btn.nonveg .dot{ background: var(--nonveg); }
  .filter-btn.active{
    background: var(--yellow);
    color:#1a1508;
    border-color: var(--yellow-deep);
    transform: translateY(-1px);
  }
  .filter-btn.active .dot{ background:#1a1508; }
  .filter-btn:active{ transform: scale(0.97); }

  /* ---------- CATEGORY NAV ---------- */
  .cat-nav{
    display:flex; gap:8px;
    overflow-x:auto;
    padding: 12px 18px 14px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-chip{
    flex-shrink:0;
    padding: 8px 15px;
    font-size: 12px;
    font-weight:700;
    letter-spacing: 0.6px;
    color: var(--white);
    background: transparent;
    border: 1.5px dashed #4a4237;
    border-radius: 20px;
    cursor:pointer;
    white-space:nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .cat-chip.active{
    background: rgba(246,197,26,0.14);
    border-color: var(--yellow);
    color: var(--yellow);
  }

  /* ---------- SECTION / BRUSH BANNER ---------- */
  section.menu-section{ padding: 6px 18px 8px; scroll-margin-top: 150px; }
  .brush-wrap{
    display:inline-block;
    position:relative;
    margin: 14px 0 14px;
  }
  .brush-banner{
    position:relative;
    display:inline-block;
    background: var(--yellow);
    color:#1a1508;
    font-family:'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 1.5px;
    padding: 5px 20px 8px 18px;
    border-radius: 3px 16px 4px 14px / 10px 4px 14px 4px;
    transform: rotate(-1.1deg);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  }
  .brush-banner::before{
    content:"";
    position:absolute; inset: -3px -6px -4px -4px;
    background: var(--yellow-deep);
    border-radius: 4px 18px 3px 16px / 12px 3px 16px 3px;
    z-index:-1;
    opacity:0.55;
    transform: rotate(1deg);
  }
  .section-sub{
    font-size:11px; color: var(--muted); margin: -6px 0 4px 2px; letter-spacing:0.5px;
  }

  .group-label{
    display:flex; align-items:center; gap:7px;
    font-size: 12px; font-weight:800; letter-spacing:1.2px;
    margin: 16px 2px 8px;
  }
  .group-label.veg{ color: var(--veg); }
  .group-label.nonveg{ color: var(--nonveg); }
  .group-label .bar{ flex:1; height:1px; background: currentColor; opacity:0.35; }

  /* ---------- ITEM CARD ---------- */
  .cards{ display:flex; flex-direction:column; gap:10px; }
  .item-card{
    background: var(--card);
    border: 1.5px dashed var(--card-border);
    border-radius: 12px 14px 11px 15px;
    padding: 12px 13px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    animation: cardIn .28s ease both;
  }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .item-thumb{
    width: 52px; height:52px; flex-shrink:0;
    border-radius: 9px;
    background: linear-gradient(135deg, #2a241d, #201b16);
    border: 1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }

  .item-body{ flex:1; min-width:0; }
  .item-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .item-name{ font-size: 14.5px; font-weight:700; color: var(--white); line-height:1.25; }
  .veg-badge{
    flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px;
    border-radius:3px;
    border: 1.6px solid var(--veg);
    margin-top:2px;
  }
  .veg-badge.nonveg{ border-color: var(--nonveg); }
  .veg-badge span{ width:7px; height:7px; border-radius:50%; background: var(--veg); }
  .veg-badge.nonveg span{ background: var(--nonveg); border-radius: 50%; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: var(--nonveg); width:8px;height:8px;border-radius:0; }

  .item-desc{ font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.35; }

  .price-row{ display:flex; gap:16px; margin-top:8px; flex-wrap:wrap; }
  .price-block{ display:flex; flex-direction:column; }
  .price-label{ font-size:9.5px; color:var(--muted); letter-spacing:1px; font-weight:700; }
  .price-val{ font-size:15.5px; color: var(--yellow); font-weight:800; font-family:'Work Sans',sans-serif; }
  .price-val .rs{ font-size:12px; margin-right:1px; }

  .empty-state{
    text-align:center; padding: 40px 20px; color: var(--muted);
  }
  .empty-state .big{ font-size:15px; color:var(--white); font-weight:700; margin-bottom:6px; }

  /* ---------- CONTACT SECTION ---------- */
  .contact-section{ margin-top: 6px; }
  .contact-cards{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .contact-card{
    display:flex; align-items:center; gap:12px;
    background: var(--card);
    border: 1.5px dashed var(--yellow);
    border-radius: 13px 15px 12px 16px;
    padding: 13px 14px;
    text-decoration:none;
    transition: transform .12s ease, background .15s ease;
  }
  .contact-card:active{ transform: scale(0.98); background: #241f19; }
  .contact-icon{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius: 50%;
    background: rgba(217,70,59,0.14);
    color: var(--nonveg);
    display:flex; align-items:center; justify-content:center;
  }
  .contact-icon svg{ width:18px; height:18px; }
  .contact-text{ flex:1; min-width:0; }
  .contact-label{ font-size:10px; letter-spacing:1.2px; color: var(--muted); font-weight:700; }
  .contact-number{ font-size:16px; color: var(--white); font-weight:800; margin-top:2px; letter-spacing:0.3px; }
  .contact-call-btn{
    flex-shrink:0;
    background: var(--yellow);
    color:#1a1508;
    font-family:'Work Sans', sans-serif;
    font-weight:800;
    font-size: 11px;
    letter-spacing: 0.6px;
    padding: 8px 12px;
    border-radius: 8px;
  }

  .toast{
    position:fixed; left:50%; bottom:22px; transform: translateX(-50%) translateY(20px);
    background: var(--yellow); color:#1a1508;
    font-weight:700; font-size:12.5px;
    padding: 11px 18px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 300;
    max-width: 88%;
    text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---------- FOOTER ---------- */
  footer.app-footer{
    text-align:center;
    padding: 28px 18px 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing:0.5px;
  }
  footer.app-footer .fname{ color: var(--yellow); font-family:'Bebas Neue', sans-serif; font-size:16px; letter-spacing:1px; }

  /* ---------- INTRO POPUP ---------- */
  .app-content{ transition: filter .25s ease; }
  .app-content.blurred{ filter: blur(6px) brightness(0.6); pointer-events:none; user-select:none; }

  .modal-overlay{
    position:fixed; inset:0; z-index: 200;
    background: rgba(10,8,7,0.78);
    display:flex; align-items:center; justify-content:center;
    padding: 22px;
    animation: overlayIn .2s ease both;
  }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }

  .modal-card{
    width:100%; max-width: 360px;
    background: var(--card);
    border: 2px dashed var(--yellow);
    border-radius: 16px 22px 16px 22px;
    padding: 26px 20px 22px;
    text-align:center;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    animation: modalIn .3s cubic-bezier(.2,.8,.3,1.2) both;
  }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(14px) scale(0.96);} to{ opacity:1; transform:none; } }

  .modal-eyebrow{
    font-size:10.5px; color:var(--muted); letter-spacing:2px; margin-bottom:10px;
  }
  .modal-banner-wrap{ margin-bottom: 6px; }
  .modal-banner{
    display:inline-block;
    background: var(--yellow);
    color:#1a1508;
    font-family:'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    padding: 6px 16px 8px;
    border-radius: 4px 16px 4px 14px / 10px 4px 14px 4px;
    transform: rotate(-1deg);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  }
  .modal-sub{
    font-size: 12.5px; color: var(--muted); margin: 14px 0 18px;
    line-height:1.4;
  }

  .modal-options{ display:flex; flex-direction:column; gap:10px; }
  .modal-opt{
    display:flex; align-items:center; gap:10px;
    padding: 13px 16px;
    background: var(--bg-2);
    border: 1.5px solid var(--card-border);
    border-radius: 11px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size: 14px;
    color: var(--white);
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
    text-align:left;
  }
  .modal-opt:active{ transform: scale(0.98); }
  .modal-opt .swatch{ width:14px; height:14px; border-radius:4px; flex-shrink:0; }
  .modal-opt.veg{ border-color: rgba(63,163,77,0.4); }
  .modal-opt.veg:hover, .modal-opt.veg:active{ border-color: var(--veg); background: rgba(63,163,77,0.08); }
  .modal-opt.veg .swatch{ background: var(--veg); }
  .modal-opt.nonveg{ border-color: rgba(217,70,59,0.4); }
  .modal-opt.nonveg:hover, .modal-opt.nonveg:active{ border-color: var(--nonveg); background: rgba(217,70,59,0.08); }
  .modal-opt.nonveg .swatch{ background: var(--nonveg); clip-path: polygon(50% 8%, 10% 92%, 90% 92%); border-radius:0; }
  .modal-opt.all .swatch{ background: var(--yellow); }
  .modal-opt.all:hover, .modal-opt.all:active{ border-color: var(--yellow); background: rgba(246,197,26,0.08); }
  .modal-opt .arrow{ margin-left:auto; color:var(--muted); font-size:14px; }

  /* ---------- TABLET / DESKTOP ---------- */
  @media (min-width: 720px){
    :root{ --maxw: 980px; }
    .cards{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .brand-name{ font-size:42px; }
    .filters{ max-width:420px; }
  }
  @media (min-width: 1080px){
    .cards{ grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>

/* ===================== STATE ===================== */
const state = { filter: "all", showModal: true }; // filter: 'all' | 'veg' | 'nonveg'

/* ===================== COMPONENTS ===================== */
function Header(){
  return `
  <header class="top">
    <div class="top-row">
      <div>
        <div class="brand-name">THE HUNGER HOUSE</div>
        <div class="brand-tag">EAT &bull; CHILL &bull; REPEAT</div>

    </div>

function FilterTabs(){
  const opts = [
    {key:"all", label:"ALL", cls:"all"},
    {key:"veg", label:"VEG", cls:"veg"},
    {key:"nonveg", label:"NON-VEG", cls:"nonveg"},
  ];
  return `<div class="filters">
    ${opts.map(o => `
      <button class="filter-btn ${o.cls} ${state.filter===o.key?'active':''}" data-filter="${o.key}">
        <span class="dot"></span>${o.label}
      </button>`).join("")}
  </div>`;
}

function CategoryNav(){
  return `<nav class="cat-nav">
    ${MENU_DATA.map(c => `<button class="cat-chip" data-scroll="${c.id}">${c.icon} ${c.label.toUpperCase()}</button>`).join("")}
  </nav>`;
}

function VegBadge(veg){
  return `<span class="veg-badge ${veg? '':'nonveg'}" title="${veg? 'Vegetarian':'Non-Vegetarian'}"><span></span></span>`;
}

function PriceDisplay(item){
  if(item.price !== undefined){
    return `<div class="price-row">
      <div class="price-block">
        <span class="price-label">PRICE</span>
        <span class="price-val"><span class="rs">₹</span>${item.price}</span>
      </div>
    </div>`;
  }
  const blocks = [];
  if(item.half !== undefined){
    blocks.push(`<div class="price-block"><span class="price-label">HALF</span><span class="price-val"><span class="rs">₹</span>${item.half}</span></div>`);
  }
  if(item.full !== undefined){
    blocks.push(`<div class="price-block"><span class="price-label">FULL</span><span class="price-val"><span class="rs">₹</span>${item.full}</span></div>`);
  }
  return `<div class="price-row">${blocks.join("")}</div>`;
}

function MenuItemCard(item){
  return `
  <div class="item-card">
    <div class="item-thumb">${item.icon || (item.veg ? '🥗' : '🍗')}</div>
    <div class="item-body">
      <div class="item-top">
        <div class="item-name">${item.name}</div>
        ${item.neutral ? "" : VegBadge(item.veg)}
      </div>
      ${PriceDisplay(item)}
    </div>
  </div>`;
}

function matchesFilter(item){
  if(state.filter === "all") return true;
  if(state.filter === "veg") return item.veg;
  if(state.filter === "nonveg") return !item.veg;
  return true;
}

function MenuSection(cat){
  const items = cat.items.filter(matchesFilter);
  if(items.length === 0) return "";

  let body = "";
  if(state.filter === "all" && items.some(i=>!i.neutral)){
    const vegItems = items.filter(i=>i.veg);
    const nonvegItems = items.filter(i=>!i.veg);
    if(vegItems.length){
      body += `<div class="group-label veg">VEG<span class="bar"></span></div><div class="cards">${vegItems.map(MenuItemCard).join("")}</div>`;
    }
    if(nonvegItems.length){
      body += `<div class="group-label nonveg">NON-VEG<span class="bar"></span></div><div class="cards">${nonvegItems.map(MenuItemCard).join("")}</div>`;
    }
  } else {
    body = `<div class="cards">${items.map(MenuItemCard).join("")}</div>`;
  }

  return `
  <section class="menu-section" id="sec-${cat.id}">
    <div class="brush-wrap"><div class="brush-banner">${cat.label.toUpperCase()}</div></div>
    ${body}
  </section>`;
}

function IntroModal(){
  return `
  <div class="modal-overlay" id="intro-modal">
    <div class="modal-card">
      <div class="modal-eyebrow">BEFORE WE BEGIN</div>
      <div class="modal-banner-wrap"><div class="modal-banner">WHAT ARE YOU CRAVING?</div></div>
      <div class="modal-sub">Pick a preference and we'll show you the right dishes straight away.</div>
      <div class="modal-options">
        <button class="modal-opt veg" data-choice="veg">
          <span class="swatch"></span> Vegetarian <span class="arrow">&rsaquo;</span>
        </button>
        <button class="modal-opt nonveg" data-choice="nonveg">
          <span class="swatch"></span> Non-Vegetarian <span class="arrow">&rsaquo;</span>
        </button>
        <button class="modal-opt all" data-choice="all">
          <span class="swatch"></span> Show Me Everything <span class="arrow">&rsaquo;</span>
        </button>
      </div>
    </div>
  </div>`;
}

function EmptyState(){
  return `<div class="empty-state">
    <div class="big">Nothing here in this filter</div>
    Try switching to "ALL" to see the full menu.
  </div>`;
}

function ContactSection(){
  const numbers = [
    { label: "Order & Inquiry", number: "7764955719" },
    { label: "Order & Inquiry", number: "8292443337" },
  ];
  return `
  <section class="menu-section contact-section">
    <div class="brush-wrap"><div class="brush-banner">CONTACT US</div></div>
    <div class="section-sub">For orders, table booking or any questions — call us directly.</div>
    <div class="contact-cards">
      ${numbers.map((n, i) => `
        <a class="contact-card" href="tel:+91${n.number}" data-phone="+91${n.number}">
          <div class="contact-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <div class="contact-text">
            <div class="contact-label">${n.label} ${numbers.length > 1 ? (i+1) : ""}</div>
            <div class="contact-number">+91 ${n.number}</div>
          </div>
          <div class="contact-call-btn">CALL NOW</div>
        </a>
      `).join("")}
    </div>
  </section>`;
}

function Footer(){
  return `<footer class="app-footer">
    <div class="fname">THE HUNGER HOUSE</div>
    Saroj Vatika, Mirzamurad, Varanasi<br/>
    Prices are inclusive of applicable taxes.
  </footer>`;
}

/* ===================== RENDER ===================== */
function render(){
  const sections = MENU_DATA.map(MenuSection).join("");
  const anyVisible = MENU_DATA.some(c => c.items.some(matchesFilter));

  document.getElementById("app").innerHTML = `
    <div class="app-content ${state.showModal ? 'blurred' : ''}">
      ${Header()}
      ${FilterTabs()}
      ${CategoryNav()}
      ${anyVisible ? sections : EmptyState()}
      ${ContactSection()}
      ${Footer()}
    </div>
    ${state.showModal ? IntroModal() : ""}
    <div class="toast" id="toast">Copied</div>
  `;

  document.body.style.overflow = state.showModal ? "hidden" : "";
  attachEvents();
}

function attachEvents(){
  document.querySelectorAll(".modal-opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.filter = btn.dataset.choice;
      state.showModal = false;
      render();
      window.scrollTo({top:0, behavior:"instant"});
    });
  });
  document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.filter = btn.dataset.filter;
      render();
    });
  });
  document.querySelectorAll(".cat-chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const el = document.getElementById("sec-" + chip.dataset.scroll);
      if(el){
        const y = el.getBoundingClientRect().top + window.scrollY - 140;
        window.scrollTo({top:y, behavior:"smooth"});
      }
    });
  });
  document.querySelectorAll(".contact-card").forEach(card=>{
    card.addEventListener("click", (e)=>{
      const phone = card.dataset.phone;
      const canDial = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                       (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      if(canDial){
        // Let the tel: link do its job — the device dialer takes over.
        showToast(`Calling ${phone}…`);
        return;
      }
      // Desktop / any environment that can't place calls: copy the number instead.
      e.preventDefault();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(phone)
          .then(()=> showToast(`${phone} copied to clipboard`))
          .catch(()=> showToast(`Call us at ${phone}`));
      }else{
        showToast(`Call us at ${phone}`);
      }
    });
  });
}

function showToast(msg){
  const toast = document.getElementById("toast");
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove("show"), 2200);
}

render();
</script>
</body>
</html>
